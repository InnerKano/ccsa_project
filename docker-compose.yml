services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ccsa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ccsa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    working_dir: /workspace/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ccsa}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    working_dir: /workspace/frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    # node_modules lives in a named volume (isolated from the host bind-mount),
    # so it survives `--build` and can go stale when package.json changes.
    # Syncing on startup keeps the "rebuild → up → localhost:3000" flow honest:
    # new deps are always present without a manual reinstall (see
    # workflows/implement-feature.md Step 6).
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  frontend_node_modules:
